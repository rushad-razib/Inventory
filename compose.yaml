services:
  mysql:
    image: mysql:8.4
    container_name: meridian-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: meridian
      MYSQL_USER: meridian
      MYSQL_PASSWORD: secret
    volumes:
      - meridian_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umeridian", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  meridian_mysql:
