# Test on every push and pull request.
# Deploy to cPanel (inventory.rushadrazib.com) after those tests pass on main.
#
# Required GitHub repo secrets:
#   DEPLOY_HOST     - SSH host (e.g. rushadrazib.com)
#   DEPLOY_USER     - SSH user
#   DEPLOY_SSH_KEY  - private key whose public half is in ~/.ssh/authorized_keys
#   DEPLOY_PATH     - Laravel root, e.g. /home/<user>/inventory.rushadrazib.com
#                     The subdomain document root must be that path plus /public.
#   APP_KEY         - stable php artisan key:generate value; do not rotate each deploy
#   DB_HOST, DB_USER, DB_PASSWORD, DB_NAME
#
# Optional:
#   DEPLOY_PORT     - SSH port (default 22)
#   DEPLOY_PHP      - absolute path to PHP 8.3+ on the server (e.g. /usr/local/bin/ea-php83)
#   DB_PORT         - MySQL port (default 3306)
#
# The workflow writes .env on the server from these secrets. It is never committed
# and is not included in the uploaded archive. db:seed is not run: the seeder
# resets the admin password.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
      - name: Pint
        run: vendor/bin/pint --test
      - name: Pest
        run: php artisan test
      - name: OpenAPI drift
        run: |
          php artisan migrate --force --no-interaction
          php artisan scramble:export --path=storage/app/openapi.json
          php bin/export-openapi.php
          git diff --exit-code -- ../../openapi/openapi.v1.yaml

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test

  deploy:
    name: Deploy
    needs: [api, web]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          test -n "${DEPLOY_SSH_KEY}"
          test -n "${DEPLOY_PATH}"
          test -n "${APP_KEY}"
          test -n "${DB_HOST}"
          test -n "${DB_USER}"
          test -n "${DB_PASSWORD}"
          test -n "${DB_NAME}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, fileinfo, tokenizer, bcmath, curl, pdo_mysql
          coverage: none
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install PHP dependencies
        working-directory: apps/api
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate --force
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web
        working-directory: apps/web
        env:
          VITE_API_URL: ""
        run: npm run build

      - name: Copy SPA into Laravel public
        run: |
          set -euo pipefail
          rm -rf apps/api/public/assets
          mkdir -p apps/api/public/assets
          cp -a apps/web/dist/assets/. apps/api/public/assets/
          cp apps/web/dist/index.html apps/api/public/spa.html
          find apps/web/dist -maxdepth 1 -type f ! -name index.html -exec cp -f {} apps/api/public/ \;
          test -s apps/api/public/spa.html
          find apps/api/public/assets -type f | grep -q .

      - name: Prepare deploy tree
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          cp -a apps/api/app apps/api/bootstrap apps/api/config apps/api/database apps/api/public apps/api/resources apps/api/routes apps/api/vendor deploy/
          cp apps/api/artisan apps/api/composer.json apps/api/composer.lock deploy/
          rm -f deploy/database/*.sqlite deploy/database/*.sqlite-journal deploy/.env
          test -f deploy/public/spa.html
          test -f deploy/public/index.php
          test ! -f deploy/.env

      - name: Write production env
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          $port = getenv('DB_PORT');
          if ($port === false || $port === '') {
              $port = '3306';
          }

          $values = [
              'APP_NAME' => 'Meridian',
              'APP_ENV' => 'production',
              'APP_KEY' => getenv('APP_KEY'),
              'APP_DEBUG' => '0',
              'APP_URL' => 'https://inventory.rushadrazib.com',
              'FRONTEND_URL' => 'https://inventory.rushadrazib.com',
              'APP_LOCALE' => 'en',
              'APP_FALLBACK_LOCALE' => 'en',
              'APP_FAKER_LOCALE' => 'en_US',
              'APP_MAINTENANCE_DRIVER' => 'file',
              'BCRYPT_ROUNDS' => '12',
              'LOG_CHANNEL' => 'stack',
              'LOG_STACK' => 'single',
              'LOG_DEPRECATIONS_CHANNEL' => 'null',
              'LOG_LEVEL' => 'error',
              'DB_CONNECTION' => 'mysql',
              'DB_HOST' => getenv('DB_HOST'),
              'DB_PORT' => $port,
              'DB_DATABASE' => getenv('DB_NAME'),
              'DB_USERNAME' => getenv('DB_USER'),
              'DB_PASSWORD' => getenv('DB_PASSWORD'),
              'SESSION_DRIVER' => 'database',
              'SESSION_LIFETIME' => '120',
              'SESSION_PATH' => '/',
              'SESSION_DOMAIN' => 'inventory.rushadrazib.com',
              'SESSION_SECURE_COOKIE' => 'true',
              'SESSION_SAME_SITE' => 'lax',
              'SANCTUM_STATEFUL_DOMAINS' => 'inventory.rushadrazib.com',
              'BROADCAST_CONNECTION' => 'log',
              'FILESYSTEM_DISK' => 'local',
              'QUEUE_CONNECTION' => 'database',
              'CACHE_STORE' => 'database',
              'MAIL_MAILER' => 'log',
          ];

          $lines = [];
          foreach ($values as $key => $value) {
              if ($value === false || $value === '') {
                  fwrite(STDERR, "Missing value for {$key}.\n");
                  exit(1);
              }

              $value = str_replace(["\n", "\r"], '', (string) $value);
              if (preg_match('/^(?:true|false|null|\d+)$/', $value) || preg_match('/^[A-Za-z0-9_.:\/@+-]+$/', $value)) {
                  $lines[] = $key.'='.$value;
                  continue;
              }

              $escaped = str_replace(['\\', '"', '$'], ['\\\\', '\\"', '\\$'], $value);
              $lines[] = $key.'="'.$escaped.'"';
          }

          if (file_put_contents('production.env', implode("\n", $lines)."\n") === false) {
              fwrite(STDERR, "Could not write production env.\n");
              exit(1);
          }
          PHP
          test -s production.env
          if grep -q '^APP_KEY=$' production.env || grep -q '^DB_PASSWORD=""$' production.env; then
            echo "Production env is missing APP_KEY or DB_PASSWORD."
            exit 1
          fi

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY is not a usable private key. Paste the full private key file, including the BEGIN and END lines. Do not paste the .pub file."
            exit 1
          fi
          ssh-keygen -lf ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "${PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/deploy_key -p "${PORT}" -o IdentitiesOnly=yes -o RequestTTY=no)
          tar -C deploy -czf - . | ssh "${SSH_OPTS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash --noprofile --norc -c 'mkdir -p \"${DEPLOY_PATH}\" && cd \"${DEPLOY_PATH}\" && rm -rf app bootstrap config database public resources routes vendor artisan composer.json composer.lock && mkdir -p storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views storage/app/public bootstrap/cache && tar -xzf -'"

      - name: Upload production env
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          scp -i ~/.ssh/deploy_key -P "${PORT}" -o IdentitiesOnly=yes \
            production.env \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.env"

      - name: Migrate and cache on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PHP: ${{ secrets.DEPLOY_PHP }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "${PORT}" -o IdentitiesOnly=yes -o RequestTTY=no \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            DEPLOY_PATH="${DEPLOY_PATH}" \
            DEPLOY_PHP="${DEPLOY_PHP}" \
            bash --noprofile --norc -s <<'REMOTE'
          set -euo pipefail
          cd "${DEPLOY_PATH}"

          if [ ! -f .env ]; then
            echo "Missing ${DEPLOY_PATH}/.env"
            exit 1
          fi

          PHP_BIN=""
          if [ -n "${DEPLOY_PHP:-}" ] && [ -x "${DEPLOY_PHP}" ]; then
            PHP_BIN="${DEPLOY_PHP}"
          else
            for candidate in \
              /usr/local/bin/ea-php83 \
              /opt/cpanel/ea-php83/root/usr/bin/php \
              /usr/local/bin/ea-php84 \
              /opt/cpanel/ea-php84/root/usr/bin/php \
              /usr/local/bin/ea-php82 \
              /opt/cpanel/ea-php82/root/usr/bin/php \
              php
            do
              if [ -x "${candidate}" ] || command -v "${candidate}" >/dev/null 2>&1; then
                PHP_BIN="${candidate}"
                break
              fi
            done
          fi

          if [ -z "${PHP_BIN}" ]; then
            echo "No PHP binary found. Set DEPLOY_PHP to the PHP 8.3 path (e.g. /usr/local/bin/ea-php83)."
            exit 1
          fi

          echo "Using PHP: ${PHP_BIN} ($("${PHP_BIN}" -r 'echo PHP_VERSION;'))"
          "${PHP_BIN}" -r 'exit(version_compare(PHP_VERSION, "8.2.0", ">=") ? 0 : 1);' \
            || { echo "Need PHP >= 8.2. Set MultiPHP to 8.3 and DEPLOY_PHP to that binary."; exit 1; }

          mkdir -p storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views storage/app/public bootstrap/cache
          chmod -R ug+rwx storage bootstrap/cache || true

          "${PHP_BIN}" artisan config:clear
          "${PHP_BIN}" artisan route:clear
          "${PHP_BIN}" artisan view:clear
          "${PHP_BIN}" artisan migrate --force --no-interaction
          "${PHP_BIN}" artisan storage:link --force
          "${PHP_BIN}" artisan config:cache
          "${PHP_BIN}" artisan route:cache
          "${PHP_BIN}" artisan view:cache
          echo "Deploy finished."
          REMOTE
