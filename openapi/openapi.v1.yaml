openapi: 3.1.2
info:
  title: 'Meridian API'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000/api'
paths:
  /v1/adjustments:
    get:
      operationId: adjustment.index
      tags:
        - Adjustment
      parameters:
        -
          name: 'filter[warehouse_id]'
          in: query
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      last_page: { type: integer }
                    required:
                      - page
                      - per_page
                      - total
                      - last_page
                required:
                  - data
                  - meta
        422:
          description: ''
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    const: /problems/validation-failed
                  title:
                    type: string
                    const: 'Validation Failed'
                  status:
                    type: integer
                    const: 422
                  detail:
                    type: string
                    const: 'One or more fields failed validation.'
                  errors:
                    type: object
                    properties:
                      status: { type: array, prefixItems: [{ type: string, const: 'Unknown status.' }], minItems: 1, maxItems: 1 }
                    required:
                      - status
                required:
                  - type
                  - title
                  - status
                  - detail
                  - errors
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
    post:
      operationId: adjustment.store
      tags:
        - Adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreAdjustmentRequest'
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: []
                required:
                  - data
        403:
          $ref: '#/components/responses/AuthorizationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/v1/adjustments/{adjustment}/approve':
